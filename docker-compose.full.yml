# GENERATED by scripts/generate-full-stack.mjs — do not hand-edit.
#
# One-command self-hosted cloud:  docker compose -f docker-compose.full.yml up -d --build
# Stop:                           docker compose -f docker-compose.full.yml down
#
# Conductor API : http://localhost:${CONDUCTOR_PORT:-3000}
# Dashboard     : http://localhost:${FRONTEND_PORT:-19006}
# Each manager  : http://localhost:<port> (see comments below)

services:

  conductor:
    build:
      context: ./conductor
      dockerfile: Dockerfile
    container_name: aerekos-conductor
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - DATABASE_PATH=/app/data/conductor.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - TOKEN_SECRET=${TOKEN_SECRET:-change-me-in-production}
      # Seed a fixed worker registration token so the worker can self-register.
      - WORKER_REGISTRATION_TOKEN=${WORKER_TOKEN:-aerekos-dev-token}
      # Deployed version (git short SHA), set by scripts/deploy/deploy.sh.
      - APP_VERSION=${APP_VERSION:-dev}
    ports:
      - "${CONDUCTOR_PORT:-3000}:3000"
    volumes:
      - conductor-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aerekos

  frontend:
    build:
      context: ./conductor/app
      dockerfile: Dockerfile.dev
    container_name: aerekos-frontend
    restart: unless-stopped
    environment:
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-https://cloudapi.aerekos.com}
      - NODE_ENV=development
    ports:
      - "${FRONTEND_PORT:-19006}:19006"
    # Mount the app source so UI edits hot-reload without rebuilding the image.
    # The anonymous volume keeps the container's (alpine-built) node_modules.
    volumes:
      - ./conductor/app:/app
      - /app/node_modules
    depends_on:
      conductor:
        condition: service_healthy
    networks:
      - aerekos

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: aerekos-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3001
      - CONDUCTOR_URL=http://conductor:3000
      - CONDUCTOR_TOKEN=${WORKER_TOKEN:-aerekos-dev-token}
      # 2s heartbeat so the dashboard's live metrics feel real-time (the 3D view
      # interpolates between updates). Bump this up for large fleets in production.
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-2}
      - RESOURCE_CHECK_INTERVAL=${RESOURCE_CHECK_INTERVAL:-60}
      # Deployed version (git short SHA), set by scripts/deploy/deploy.sh.
      - APP_VERSION=${APP_VERSION:-dev}
    # Real host specs (CPU/RAM/disk/network/hostname/IP) detected on the host by
    # `make detect` (worker/detect-host-resources.sh). Optional: the worker falls
    # back to container values if this file is absent.
    env_file:
      - path: .worker-host.env
        required: false
    ports:
      - "${WORKER_PORT:-3001}:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker-data:/app/data
    depends_on:
      conductor:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aerekos

  aerekos-updater:
    build:
      context: ./updater
      dockerfile: Dockerfile
    container_name: aerekos-updater
    restart: unless-stopped
    environment:
      - CONDUCTOR_URL=http://conductor:3000
      - AEREKOS_AGENT_TOKEN=${WORKER_TOKEN:-aerekos-dev-token}
      - HOST_DIR=${AEREKOS_HOST_DIR:-/home/aerekos/work/aerekos/aerekos-cloud}
      - ROLE=full
      - POLL_INTERVAL=${UPDATE_POLL_INTERVAL:-30}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${AEREKOS_HOST_DIR:-/home/aerekos/work/aerekos/aerekos-cloud}:${AEREKOS_HOST_DIR:-/home/aerekos/work/aerekos/aerekos-cloud}
    depends_on:
      conductor:
        condition: service_healthy
    networks:
      - aerekos

  docs:
