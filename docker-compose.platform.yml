# Always-on control-plane managers (one process per conductor-role device).
# Use WITH core, never --remove-orphans:
#   docker compose -f docker-compose.core.yml -f docker-compose.platform.yml up -d --build --no-deps <svc>
#
# Data is still project_id-scoped. Do not start these on orin (GPU) or as a second copy per project.
# billing / ai / comms / app / function stay out of this file.
services:
  queue_manager:
    build: { context: ./worker, dockerfile: queue_manager/Dockerfile }
    container_name: aerekos-queue_manager
    restart: unless-stopped
    environment: &platenv
      - NODE_ENV=${NODE_ENV:-production}
      - CONDUCTOR_URL=${CONDUCTOR_INTERNAL_URL:-http://host.docker.internal:3300}
      - CONDUCTOR_TOKEN=${WORKER_TOKEN:-aerekos-dev-token}
      - SKIP_SERVICE_REGISTRATION=true
      - PORT=3101
      - SERVICE_NAME=queue_manager
    ports: ["3101:3101"]
    volumes: [queue_manager-data:/app/queue_manager/data]
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [aerekos]

  schedule_manager:
    build: { context: ./worker, dockerfile: schedule_manager/Dockerfile }
