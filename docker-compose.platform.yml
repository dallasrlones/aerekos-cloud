      - PORT=3103
      - SERVICE_NAME=network_manager
    ports: ["3103:3103"]
    volumes:
      - network_manager-data:/app/network_manager/data
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts: ["host.docker.internal:host-gateway"]
