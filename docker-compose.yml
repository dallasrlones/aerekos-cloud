# OPTIONAL: Root docker-compose.yml for convenience/testing
# 
# NOTE: The actual architecture uses separate docker-compose files:
# - conductor/docker-compose.yml (conductor + frontend)
# - worker/docker-compose.yml (primary worker container)
# - worker/[service_name]/docker-compose.yml (each service)
#
# Default *host* ports are intentionally off the common 3xxx range (3000, 3001) so they
# are less likely to clash with other local dev. Override with CONDUCTOR_PORT, etc.
# Full scripted E2E: `npm run e2e:docker` (see `docker/e2e-compose.yml`).

version: '3.8'

services:
  conductor:
    build:
      context: ./conductor
      dockerfile: Dockerfile.dev
    container_name: aerekos-cloud-conductor
    ports:
      - "${CONDUCTOR_PORT:-38470}:3000"
    volumes:
      - ./conductor/data:/app/data
      - ./conductor/api:/app/api
      - ./conductor/scripts:/app/scripts
      - ./conductor/index.js:/app/index.js
      - ./conductor/nodemon.json:/app/nodemon.json
      - ./worker/shared:/app/worker-shared:ro
    env_file:
      - ./conductor/.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3000
      - DATABASE_PATH=/app/data/conductor.db
      - CONDUCTOR_INTERNAL_BASE_URL=${CONDUCTOR_INTERNAL_BASE_URL:-http://aerekos-conductor:3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      aerekos-cloud-network: {}
      core_managers:
        aliases:
          - aerekos-conductor

  frontend:
    build:
      context: ./conductor/app
      dockerfile: Dockerfile.dev
    container_name: aerekos-cloud-frontend
    ports:
      - "${FRONTEND_PORT:-38406}:19006"
      - "38400:19000"  # Expo (non-default host ports)
      - "38401:19001"
    environment:
      - EXPO_PUBLIC_API_URL=${EXPO_PUBLIC_API_URL:-https://cloudapi.aerekos.com}
      - NODE_ENV=development
    volumes:
      - ./conductor/app:/app
      - /app/node_modules
    depends_on:
      - conductor
    restart: unless-stopped
    stdin_open: true
    tty: true
    networks:
      - aerekos-cloud-network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    container_name: aerekos-cloud-worker
    restart: unless-stopped
    environment:
      - CONDUCTOR_URL=http://conductor:3000
      - CONDUCTOR_TOKEN=${WORKER_TOKEN}
      - HEARTBEAT_INTERVAL=${HEARTBEAT_INTERVAL:-30}
      - RESOURCE_CHECK_INTERVAL=${RESOURCE_CHECK_INTERVAL:-60}
      - PORT=3001
      - NODE_ENV=${NODE_ENV:-development}
    ports:
      - "${WORKER_PORT:-38471}:3001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock  # For Docker container management
      - ./worker:/app  # Mount code for development
      - /app/node_modules
    depends_on:
      - conductor
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - aerekos-cloud-network

networks:
  aerekos-cloud-network:
    driver: bridge
  # Mixed homelab: managers live on docker-compose.core.yml's network.
  core_managers:
    external: true
    name: ${AEREKOS_CORE_NETWORK:-aerekos-cloud_aerekos}
