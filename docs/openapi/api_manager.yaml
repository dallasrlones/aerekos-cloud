openapi: 3.0.3
info:
  title: api_manager (API Gateway analog)
  version: 1.0.0
  description: |
    Project-scoped gateway route metadata (method / public_path → target_service + ARN)
    plus hosted Data API (schema apply → SQLite CRUD, hooks, scale).
    Does not terminate public TLS or reverse-proxy traffic itself — conductor GatewayService
    calls POST /api/v1/endpoints/match then proxies to target_service.
    Conductor proxy prefix: /api/services/api_manager
servers:
  - url: http://localhost:3124
    description: Direct local
  - url: http://localhost:3000/api/services/api_manager
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, message }'
  /api/v1/ensure-defaults:
    post:
      summary: Seed Data API defaults for project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
      responses:
        '200':
          description: '{ ok, defaults }'
        '400':
          description: missing project_id
  /api/v1/endpoints:
    post:
      summary: Create gateway route
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                method:
                  type: string
                public_path:
                  type: string
                target_service:
                  type: string
                target_path:
                  type: string
                resource_arn_template:
                  type: string
                  description: Must look like arn:aerekos:{project_id}:… when set
                required_scope:
                  type: string
                backend_url:
                  type: string
      responses:
        '201':
          description: '{ item } including proxy_path when target_service set'
        '400':
          description: INVALID_ARN_TEMPLATE or validation error
        '409':
          description: name taken
    get:
      summary: List routes
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/endpoints/seed-presets:
    post:
      summary: Upsert shared gateway presets for a project
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
      responses:
        '200':
          description: seed result
  /api/v1/endpoints/match:
    post:
      summary: Resolve method+path → target, proxy_path, ARN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                method:
                  type: string
                path:
                  type: string
      responses:
        '200':
          description: '{ match: { target_service, target_path, proxy_path, resource_arn, … } }'
  /api/v1/endpoints/{id}:
    get:
      summary: Get one route
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: '{ item }'
    patch:
      summary: Update route
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: '{ item }'
    put:
      summary: Update route (alias of PATCH)
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete route
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: deleted
  /api/v1/endpoints/{id}/scale:
    patch:
      summary: Set desired replicas metadata on a route
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                desired:
                  type: integer
      responses:
        '200':
          description: '{ item }'
  /api/v1/data-apis/apply:
    post:
      summary: Apply model schema → Data API
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
      responses:
        '200':
          description: apply result
  /api/v1/data-apis:
    get:
      summary: List Data APIs
      parameters:
        - in: query
          name: project_id
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/data-apis/{name}:
    get:
      summary: Get one Data API
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: '{ item }'
  /api/v1/data-apis/{name}/scale:
    post:
      summary: Scale Data API desired replicas
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                desired:
                  type: integer
      responses:
        '200':
          description: '{ item }'
    patch:
      summary: Scale Data API (alias)
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
                desired:
                  type: integer
      responses:
        '200':
          description: '{ item }'
  /api/v1/data-apis/{name}/autoscaling/evaluate:
    post:
      summary: Evaluate Data API autoscaling
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: evaluate result
  /api/v1/data/{app}/{model}:
    get:
      summary: List Data API records
      parameters:
        - in: path
          name: app
          required: true
          schema:
            type: string
        - in: path
          name: model
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: '{ items }'
    post:
      summary: Create Data API record
      parameters:
        - in: path
          name: app
          required: true
          schema:
            type: string
        - in: path
          name: model
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: '{ item }'
components:
  parameters:
    id:
      in: path
      name: id
      required: true
      schema:
        type: string
    projectId:
      in: query
      name: project_id
      required: true
      schema:
        type: string
