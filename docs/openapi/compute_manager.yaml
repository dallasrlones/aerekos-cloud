openapi: 3.0.3
info:
  title: aerekos Compute (compute_manager)
  version: 1.0.0
  description: |
    Kubernetes-class orchestrator for aerekos. Project ≈ namespace.
    Docker is the v0.1.0 node agent only. See ADR 004.
    SKIP_DOCKER is tests/local only — refused when NODE_ENV=production.
    Canonical copy: worker/compute_manager/api/openapi.yaml
servers:
  - url: /api/services/compute_manager
    description: Via conductor proxy
  - url: http://localhost:3100
    description: Direct local
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness (SQLite)
      responses:
        '200':
          description: ready
        '503':
          description: not_ready
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: OK
  /api/v1/tasks:
    post:
      summary: Create a task (legacy)
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '201':
          description: Created
    get:
      summary: List tasks
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: OK
  /api/v1/tasks/{id}:
    get:
      summary: Get a task
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
    delete:
      summary: Delete a task
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted
  /api/v1/tasks/{id}/stop:
    post:
      summary: Stop a task
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Stopped
  /api/v1/deployments/{id}:
    put:
      summary: Apply declarative Deployment
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeploymentApply'
      responses:
        '200':
          description: Applied
    get:
      summary: Get Deployment and status
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
  /api/v1/deployments/{id}/reconcile:
    post:
      summary: Reconcile once; abort on progress deadline
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Reconcile result
  /api/v1/deployments/{id}/pause:
    post:
      summary: Pause rollout
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Paused
  /api/v1/deployments/{id}/resume:
    post:
      summary: Resume rollout
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Resumed
  /api/v1/deployments/{id}/rollback:
    post:
      summary: Rollback to a prior revision
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                revision: { type: integer }
      responses:
        '200':
          description: Rolled back
components:
  parameters:
    projectId:
      name: project_id
      in: query
      required: true
      schema: { type: string }
  schemas:
    DeploymentApply:
      type: object
      properties:
        replicas: { type: integer, minimum: 0 }
        strategy:
          type: object
          properties:
            type: { type: string, enum: [RollingUpdate, Recreate] }
            maxSurge: { type: integer }
            maxUnavailable: { type: integer }
        progressDeadlineSeconds: { type: integer }
        paused: { type: boolean }
        template:
          type: object
          required: [image]
          properties:
            name: { type: string }
            image: { type: string }
            resources: { type: object }
            probes: { type: object }
