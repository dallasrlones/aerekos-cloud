openapi: 3.0.3
info:
  title: event_manager (EventBridge analog)
  version: 1.0.0
  description: |
    Project-scoped event buses (CRUD), rules, and put-event fan-out.
    ensure-defaults seeds default + aerekos.fleet buses.
    email/sms/slack targets always skipped (outbound_disabled); push skips under SKIP_OUTBOUND.
    SKIP_OUTBOUND is test/dev only — refused when NODE_ENV=production.
    Conductor proxy prefix: /api/services/event_manager
servers:
  - url: http://localhost:3132
    description: Direct local
  - url: http://localhost:3000/api/services/event_manager
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness (SQLite)
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, aws, message }'
  /api/v1/ensure-defaults:
    post:
      summary: Seed default + aerekos.fleet buses when missing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
      responses:
        '200':
          description: '{ ok, defaults }'
        '400':
          description: missing project_id
  /api/v1/events:
    post:
      summary: Put an event (match rules; return deliveries)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
                bus:
                  type: string
                  default: default
                bus_name:
                  type: string
                source:
                  type: string
                type:
                  type: string
                payload:
                  type: object
                detail:
                  type: object
      responses:
        '202':
          description: '{ event, deliveries }'
        '400':
          description: missing project_id
  /api/v1/rules:
    post:
      summary: Create a rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                bus_id:
                  type: string
                bus:
                  type: string
                source:
                  type: string
                type_pattern:
                  type: string
                target_kind:
                  type: string
                target_ref:
                  type: string
                enabled:
                  type: string
      responses:
        '201':
          description: '{ item }'
        '400':
          description: validation error
    get:
      summary: List rules
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
        - in: query
          name: bus_id
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/buses:
    post:
      summary: Create a bus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: '{ item }'
        '400':
          description: missing project_id/name
        '409':
          description: name taken
    get:
      summary: List buses
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/buses/{id}:
    get:
      summary: Get one bus
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: '{ item }'
        '404':
          description: not found
    patch:
      summary: Update a bus
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: '{ item }'
    put:
      summary: Replace/update a bus
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete a bus
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: deleted
components:
  parameters:
    id:
      in: path
      name: id
      required: true
      schema:
        type: string
    projectId:
      in: query
      name: project_id
      required: true
      schema:
        type: string
