      summary: Roll back last applied stack revision
      responses:
        '200':
          description: Success (shape varies by manager)
  /api/resources:
    get:
      summary: Fleet resource snapshot
      responses:
        '200':
          description: Success (shape varies by manager)
  /api/services:
    get:
      summary: List all registered manager services
      responses:
        '200':
          description: Success (shape varies by manager)
  /api/services/{name}:
