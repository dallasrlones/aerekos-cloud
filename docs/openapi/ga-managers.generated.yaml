openapi: 3.0.3
info:
  title: aerekos-cloud GA managers (catalog-generated)
  version: 0.1.0
  description: |
    Generated from docs/catalog.js — conductor proxy paths for core GA managers.
    Regenerate: node scripts/oss/gen-openapi-from-catalog.mjs
servers:
  - url: http://{conductor}/
    variables:
      conductor:
        default: localhost:3000
paths:
  /api/auth/login:
    post:
      summary: "Login -> { token } (JWT)"
      responses:
        '200':
          description: Success (shape varies by manager)
  /api/auth/me:
    get:
      summary: Current identity
      responses:
        '200':
          description: Success (shape varies by manager)
  /api/projects/{id}/edge/hookup:
    post:
      summary: Hook up edge using existing Cloudflare secrets
      responses:
        '200':
          description: Success (shape varies by manager)
  /api/projects/{id}/edge/status:
    get:
      summary: Edge (tunnel/DNS) hookup status
      responses:
        '200':
          description: Success (shape varies by manager)
  /api/projects/{id}/iac/hookup:
    post:
      summary: "Hook up IaC ({ mode, repo })"
      responses:
        '200':
          description: Success (shape varies by manager)
  /api/projects/{id}/iac/status:
    get:
      summary: IaC hookup status
      responses:
        '200':
          description: Success (shape varies by manager)
  /api/projects/{id}/stack:
    get:
      summary: Get project-stack JSON
      responses:
        '200':
          description: Success (shape varies by manager)
    put:
      summary: Put project-stack JSON draft
      responses:
        '200':
          description: Success (shape varies by manager)
  /api/projects/{id}/stack/apply:
    post:
      summary: "Enable wanted[] then provision resources (never prod UUID)"
      responses:
        '200':
          description: Success (shape varies by manager)
  /api/projects/{id}/stack/diff:
