openapi: 3.0.3
info:
  title: notify_manager (unified notify facade)
  version: 1.0.0
  description: |
    W9a unified notify surface for email/sms/slack/push. Project-scoped messages +
    channels CRUD, POST .../messages/{id}/send and POST /api/v1/test via shared
    notifyFacade. Non-prod defaults NOTIFY_USE_MOCK=1 (MockProvider — no paid APIs).
    NOTIFY_USE_MOCK / SKIP_OUTBOUND refused when NODE_ENV=production (assertNoSkipFakes).
    Legacy email_manager / sms_manager / slack_manager stay registered until Phase 2.
    Conductor proxy prefix: /api/services/notify_manager
servers:
  - url: http://localhost:3154
    description: Direct local
  - url: http://localhost:3000/api/services/notify_manager
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness (SQLite)
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, mock, message }'
  /api/v1/ensure-defaults:
    post:
      summary: Seed default notify message when project has none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
      responses:
        '200':
          description: '{ ok, defaults }'
        '400':
          description: missing project_id
  /api/v1/providers:
    get:
      summary: List channel providers (email/sms/slack/push)
      responses:
        '200':
          description: '{ providers, mock }'
  /api/v1/test:
    post:
      summary: Fire a mock/live notify test via facade (no message row required)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
                channel:
                  type: string
                payload:
                  type: object
                useMock:
                  type: boolean
      responses:
        '200':
          description: '{ ok, result }'
        '400':
          description: missing project_id / invalid shape
  /api/v1/messages:
    post:
      summary: Create a queued notify message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                channel:
                  type: string
                to_address:
                  type: string
                subject:
                  type: string
                body:
                  type: string
                status:
                  type: string
      responses:
        '201':
          description: '{ item }'
        '400':
          description: missing project_id/name
        '409':
          description: name taken
    get:
      summary: List messages
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/messages/{id}:
    get:
      summary: Get one message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
        '404':
          description: not found
    patch:
      summary: Update a message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                channel:
                  type: string
                to_address:
                  type: string
                subject:
                  type: string
                body:
                  type: string
                status:
                  type: string
      responses:
        '200':
          description: '{ item }'
    put:
      summary: Update a message (same as PATCH)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete a message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ deleted, id }'
  /api/v1/messages/{id}/send:
    post:
      summary: Send via notifyFacade (MockProvider when NOTIFY_USE_MOCK)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item, skipped, reason, mock, sendResult }'
        '404':
          description: not found
  /api/v1/channels:
    post:
      summary: Create a channel config row
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                channel:
                  type: string
                config:
                  type: string
                status:
                  type: string
      responses:
        '201':
          description: '{ item }'
    get:
      summary: List channels
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/channels/{id}:
    get:
      summary: Get one channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
        '404':
          description: not found
    patch:
      summary: Update a channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
    put:
      summary: Update a channel (same as PATCH)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete a channel
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ deleted, id }'
