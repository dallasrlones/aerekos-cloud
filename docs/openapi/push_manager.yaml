openapi: 3.0.3
info:
  title: push_manager (SNS mobile analog)
  version: 1.0.0
  description: |
    Project-scoped push subscription rows (name/endpoint/kind) plus
    POST /api/v1/send. Live FCM only when FCM_SERVER_KEY (+ device token)
    exist; otherwise queue-only. SKIP_PUSH / SKIP_OUTBOUND force queue in
    tests/dev — refused when NODE_ENV=production via assertNoSkipFakes.
    Conductor proxy prefix: /api/services/push_manager
    No production skip-fake flags; createManagerApp → assertNoSkipFakes() on boot.
servers:
  - url: http://localhost:3153
    description: Direct local
  - url: http://localhost:3000/api/services/push_manager
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness (SQLite)
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, aws, message }'
  /api/v1/ensure-defaults:
    post:
      summary: Seed default subscription (web) when project has none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
      responses:
        '200':
          description: '{ ok, defaults }'
        '400':
          description: missing project_id
  /api/v1/send:
    post:
      summary: Attempt FCM push / stay queued (SKIP_PUSH / missing FCM → queue_only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                to:
                  type: string
                  description: Device token (alias token also accepted)
                token:
                  type: string
                title:
                  type: string
                body:
                  type: string
      responses:
        '200':
          description: '{ skipped, reason, note? }'
  /api/v1/subscriptions:
    post:
      summary: Create a subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                endpoint:
                  type: string
                kind:
                  type: string
      responses:
        '201':
          description: '{ item }'
        '400':
          description: missing project_id/name
        '409':
          description: name taken
    get:
      summary: List subscriptions
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/subscriptions/{id}:
    get:
      summary: Get one subscription
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
        '404':
          description: not found
    patch:
      summary: Update a subscription
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                endpoint:
                  type: string
                kind:
                  type: string
      responses:
        '200':
          description: '{ item }'
    put:
      summary: Update a subscription (same as PATCH)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete a subscription
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ deleted, id }'
