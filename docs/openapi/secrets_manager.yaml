openapi: 3.0.3
info:
  title: aerekos Secrets Manager (secrets_manager)
  version: 1.0.0
  description: |
    Project-scoped secrets with AES-256-GCM envelope encryption via key_manager.
    List never returns plaintext. Use `?reveal=1` on get, or `GET /secrets/values`
    for a name→plaintext map (service-to-service).

    Access via conductor: `{VERB} {CONDUCTOR}/api/services/secrets_manager{path}`
    with JWT or service token. Never enable MOCK_KEY_MANAGER when NODE_ENV=production.
servers:
  - url: /api/services/secrets_manager
paths:
  /health:
    get:
      summary: Liveness (SQLite)
      responses:
        '200':
          description: Healthy
        '503':
          description: Unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: Ready
        '503':
          description: Not ready
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: Active service info
  /api/v1/secrets:
    post:
      summary: Create a secret ({ name, value } or imported ciphertext)
      parameters:
        - $ref: '#/components/parameters/projectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretCreate'
      responses:
        '201':
          description: Created (no plaintext/ciphertext in body)
        '400':
          description: Validation error
        '409':
          description: Name already taken in project+environment
    get:
      summary: List secrets (values redacted; optional include_ciphertext=1)
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: environment
          in: query
          schema: { type: string, default: prod }
        - name: env
          in: query
          schema: { type: string }
          description: Alias for environment
        - name: include_ciphertext
          in: query
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200':
          description: '{ secrets: [...] }'
  /api/v1/secrets/values:
    get:
      summary: Name→plaintext map for an environment (service use)
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: environment
          in: query
          schema: { type: string, default: prod }
        - name: env
          in: query
          schema: { type: string }
      responses:
        '200':
          description: '{ environment, values }'
  /api/v1/secrets/{id}:
    get:
      summary: Get a secret (?reveal=1 for plaintext value)
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: reveal
          in: query
          schema: { type: string, enum: ['1', 'true'] }
      responses:
        '200':
          description: Secret metadata; value only when reveal=1
        '404':
          description: Not found
    patch:
      summary: Update secret value and/or metadata
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SecretUpdate'
      responses:
        '200':
          description: Updated (no plaintext)
        '404':
          description: Not found
    delete:
      summary: Delete a secret
      parameters:
        - $ref: '#/components/parameters/projectId'
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: '{ deleted: true, id }'
        '404':
          description: Not found
components:
  parameters:
    projectId:
      name: project_id
      in: query
      required: true
      schema: { type: string }
      description: Also accepted via JSON body or X-Project-Id header
  schemas:
    SecretCreate:
      type: object
      required: [name]
      properties:
        project_id: { type: string }
        name:
          type: string
          description: '1-128 chars; start with a letter; [A-Za-z0-9_.-]'
        value: { type: string, description: Plaintext (encrypted at rest) }
        environment: { type: string, default: prod }
        env: { type: string }
        metadata: {}
        ciphertext: { type: string, description: Base64 import; requires key_name }
        key_name: { type: string }
        key_version: { type: integer }
    SecretUpdate:
      type: object
      properties:
        value: { type: string }
        metadata: {}
        ciphertext: { type: string }
        key_name: { type: string }
        key_version: { type: integer }
