openapi: 3.0.3
info:
  title: status_manager (Statuspage analog)
  version: 1.0.0
  description: |
    Project-scoped status incidents (CRUD /api/v1/incidents) plus GET /api/v1/public
    (aggregate ok/degraded from non-resolved incidents) and POST /api/v1/ensure-defaults
    (seeds all-clear when empty). SQLite via aerekos-record. Statuspage is a naming
    analog only — not Atlassian Statuspage. No production skip-fake flags;
    assertNoSkipFakes() + createManagerApp on boot.
    Conductor proxy prefix: /api/services/status_manager
servers:
  - url: http://localhost:3150
    description: Direct local
  - url: http://localhost:3000/api/services/status_manager
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness (SQLite)
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, aws, message }'
  /api/v1/ensure-defaults:
    post:
      summary: Seed all-clear incident when project has none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
      responses:
        '200':
          description: '{ ok, defaults }'
        '400':
          description: missing project_id
  /api/v1/public:
    get:
      summary: Public status aggregate (?project_id=)
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: '{ status: ok|degraded, incidents }'
  /api/v1/incidents:
    post:
      summary: Create an incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                severity:
                  type: string
                message:
                  type: string
                state:
                  type: string
      responses:
        '201':
          description: '{ item }'
    get:
      summary: List incidents (?project_id=)
      parameters:
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: '{ items }'
  /api/v1/incidents/{id}:
    get:
      summary: Get one incident
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: '{ item }'
        '404':
          description: not found
    patch:
      summary: Update an incident
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                severity:
                  type: string
                message:
                  type: string
                state:
                  type: string
      responses:
        '200':
          description: '{ item }'
    put:
      summary: Replace/update an incident
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete an incident
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: deleted
components:
  parameters:
    id:
      in: path
      name: id
      required: true
      schema:
        type: string
    projectId:
      in: query
      name: project_id
      required: true
      schema:
        type: string
