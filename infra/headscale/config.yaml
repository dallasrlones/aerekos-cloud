# Headscale control plane — bind API to localhost / overlay only.
# Start with: docker compose -f docker-compose.headscale.yml up -d --no-deps
# Never expose :8080 on the public internet.
server_url: http://192.168.0.141:8080
listen_addr: 0.0.0.0:8080
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

prefixes:
  v4: 100.64.0.0/10
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

dns:
  magic_dns: true
  base_domain: aerekos.internal
  nameservers:
    global:
      - 1.1.1.1
      - 9.9.9.9

derp:
  server:
    enabled: false
  urls:
    - https://controlplane.tailscale.com/derpmap/default
  paths: []
  auto_update_enabled: false

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

log:
  level: info

policy:
  mode: file
  path: /etc/headscale/acl.hujson
