# Local dev — see worker/docker-compose.yml for full stack
services:
  ai_manager:
    build:
      context: ..
      dockerfile: ai_manager/Dockerfile.dev
    container_name: aerekos-ai_manager
    ports:
      - "${PORT:-3126}:${PORT:-3126}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
