# Local dev — see worker/docker-compose.yml for full stack
services:
  analytics_manager:
    build:
      context: ..
      dockerfile: analytics_manager/Dockerfile.dev
    container_name: aerekos-analytics_manager
    ports:
      - "${PORT:-3117}:${PORT:-3117}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
