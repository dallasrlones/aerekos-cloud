# Local dev — see worker/docker-compose.yml for full stack
services:
  api_manager:
    build:
      context: ..
      dockerfile: api_manager/Dockerfile.dev
    container_name: aerekos-api_manager
    ports:
      - "${PORT:-3124}:${PORT:-3124}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
