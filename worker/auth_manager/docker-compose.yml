# Local dev — see worker/docker-compose.yml for full stack
services:
  auth_manager:
    build:
      context: ..
      dockerfile: auth_manager/Dockerfile.dev
    container_name: aerekos-auth_manager
    ports:
      - "${PORT:-3116}:${PORT:-3116}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
