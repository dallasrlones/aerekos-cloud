# Local dev — see worker/docker-compose.yml for full stack
services:
  balancer_manager:
    build:
      context: ..
      dockerfile: balancer_manager/Dockerfile.dev
    container_name: aerekos-balancer_manager
    ports:
      - "${PORT:-3109}:${PORT:-3109}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
