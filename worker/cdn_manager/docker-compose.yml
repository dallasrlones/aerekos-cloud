# Local dev — see worker/docker-compose.yml for full stack
services:
  cdn_manager:
    build:
      context: ..
      dockerfile: cdn_manager/Dockerfile.dev
    container_name: aerekos-cdn_manager
    ports:
      - "${PORT:-3118}:${PORT:-3118}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
