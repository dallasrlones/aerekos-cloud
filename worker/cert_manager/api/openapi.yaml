openapi: 3.0.3
info:
  title: cert_manager (ACM analog)
  version: 1.0.0
  description: |
    Project-scoped certificates: CRUD, mint self-signed PEM, import PEM bundle.
    No Let's Encrypt / ACME in MVP.
    Conductor proxy prefix: /api/services/cert_manager
    No production skip-fake flags; assertNoSkipFakes() via createManagerApp on boot.
servers:
  - url: http://localhost:3137
    description: Direct local
  - url: http://localhost:3000/api/services/cert_manager
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness (SQLite)
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, aws, message }'
  /api/v1/ensure-defaults:
    post:
      summary: Seed default cert when project has none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
      responses:
        '200':
          description: '{ ok, defaults }'
        '400':
          description: missing project_id
  /api/v1/certs:
    post:
      summary: Create a cert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                pem:
                  type: string
                hostnames:
                  type: string
                status:
                  type: string
      responses:
        '201':
          description: '{ item }'
        '400':
          description: validation error
    get:
      summary: List certs
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/certs/{id}:
    get:
      summary: Get one cert
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
        '404':
          description: not found
    patch:
      summary: Update a cert
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete a cert
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: deleted
  /api/v1/certs/mint:
    post:
      summary: Mint a self-signed PEM and store on the cert item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                cn:
                  type: string
                  description: Common name (defaults to name)
      responses:
        '201':
          description: '{ item, cn }'
        '400':
          description: validation error
  /api/v1/certs/import:
    post:
      summary: Import a PEM bundle onto a cert item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                  default: imported
                pem:
                  type: string
                certificate:
                  type: string
                cn:
                  type: string
                hostnames:
                  type: string
      responses:
        '201':
          description: '{ item }'
        '400':
          description: PEM required
