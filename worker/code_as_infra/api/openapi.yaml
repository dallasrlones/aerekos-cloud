openapi: 3.0.3
info:
  title: code_as_infra (CloudFormation analog)
  version: 1.0.0
  description: |
    Project-scoped IaC module / snippet CRUD (kind + content). MVP stores blobs in SQLite;
    apply/plan engine is out of scope. Catalog maturity: experimental.
    Conductor proxy prefix: /api/services/code_as_infra
servers:
  - url: http://localhost:3120
    description: Direct local
  - url: http://localhost:3000/api/services/code_as_infra
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, aws, message }'
  /api/v1/modules:
    post:
      summary: Create module
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                kind:
                  type: string
                  description: e.g. json, yaml, terraform
                content:
                  type: string
      responses:
        '201':
          description: '{ item }'
        '400':
          description: missing project_id or name
        '409':
          description: name taken
    get:
      summary: List modules
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
        '400':
          description: missing project_id
  /api/v1/modules/{id}:
    get:
      summary: Get module
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: '{ item }'
        '404':
          description: not found
    patch:
      summary: Update module
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                kind:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: '{ item }'
        '404':
          description: not found
        '409':
          description: name taken
    put:
      summary: Update module (same as PATCH)
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                kind:
                  type: string
                content:
                  type: string
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete module
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: '{ deleted, id }'
        '404':
          description: not found
components:
  parameters:
    id:
      in: path
      name: id
      required: true
      schema:
        type: string
    projectId:
      in: query
      name: project_id
      required: true
      schema:
        type: string
