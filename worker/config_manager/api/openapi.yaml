openapi: 3.0.3
info:
  title: config_manager (AppConfig analog)
  version: 1.0.0
  description: |
    Project-scoped config namespaces and flag evaluation.
    Conductor proxy prefix: /api/services/config_manager
servers:
  - url: http://localhost:3136
    description: Direct local
  - url: http://localhost:3000/api/services/config_manager
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, aws, message }'
  /api/v1/ensure-defaults:
    post:
      summary: Seed default app namespace when project has none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
      responses:
        '200':
          description: '{ ok, defaults }'
        '400':
          description: missing project_id
  /api/v1/namespaces:
    post:
      summary: Create namespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                flags:
                  type: string
                  description: JSON object string, e.g. '{"beta":true}'
      responses:
        '201':
          description: '{ item }'
    get:
      summary: List namespaces
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/namespaces/{id}:
    get:
      summary: Get namespace
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: '{ item }'
    patch:
      summary: Update namespace
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                flags:
                  type: string
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete namespace
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/projectId'
      responses:
        '200':
          description: deleted
  /api/v1/evaluate:
    post:
      summary: Evaluate a flag from a stored namespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
                namespace:
                  type: string
                  default: app
                flag:
                  type: string
                  default: example
      responses:
        '200':
          description: '{ namespace, flag, value } — missing flag/namespace yields value false'
        '400':
          description: missing project_id
components:
  parameters:
    id:
      in: path
      name: id
      required: true
      schema:
        type: string
    projectId:
      in: query
      name: project_id
      required: true
      schema:
        type: string
