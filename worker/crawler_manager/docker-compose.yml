# Local dev — see worker/docker-compose.yml for full stack
services:
  crawler_manager:
    build:
      context: ..
      dockerfile: crawler_manager/Dockerfile.dev
    container_name: aerekos-crawler_manager
    ports:
      - "${PORT:-3121}:${PORT:-3121}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
