services:
  db_manager:
    build:
      context: ..
      dockerfile: db_manager/Dockerfile.dev
    container_name: aerekos-db_manager
    ports:
      - "${PORT:-3004}:${PORT:-3004}"
    volumes:
      - ./data:/app/data
      - ./api:/app/api
      - ./index.js:/app/index.js
      - /var/run/docker.sock:/var/run/docker.sock  # Docker socket for container management
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - CONDUCTOR_URL=http://host.docker.internal:3000
      - PROJECT_ID=${PROJECT_ID}  # Must be set when deploying - db_manager is project-scoped
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "-O", "-", "http://localhost:${PORT:-3004}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aerekos-cloud-network

networks:
  aerekos-cloud-network:
    external: true
