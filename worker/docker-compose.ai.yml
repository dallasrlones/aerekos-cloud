# AI stack for a GPU host (Jetson Orin / oculus). Cloud is the only deployer.
#
# Runs auth_manager, ai_manager, LoRA trainer, and the always-on voice engines
# (Whisper STT, Kokoro TTS, TTS cache + dictionary generator). Apps reach those
# engines through Cloud integrations (orin-stt / orin-tts-kokoro / orin-tts-cache)
# on host.docker.internal:8001/8013/8015. ~/work/tools compose is leftover —
# do not start voice from there.
#
# Reuses existing model volumes and the 27G words.db bind. Do not recreate
# tts-cache data. vLLM stays in docker-compose.vllm.yml; never start it from
# this file. Never --remove-orphans.
#
#   docker compose -p aerekos-ai -f worker/docker-compose.ai.yml up -d --no-deps
services:
  auth_manager:
    build:
      context: .
      dockerfile: auth_manager/Dockerfile
    container_name: aerekos-auth_manager
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3116
      - SERVICE_NAME=auth_manager
      # Workers register over LAN; browsers use https://cloudapi.aerekos.com
      - CONDUCTOR_URL=${CONDUCTOR_URL}
      - AUTH_MANAGER_SECRET_NAME=${AUTH_MANAGER_SECRET_NAME:-auth_manager.signing_secret}
      - CONDUCTOR_CLIENT_SECRET_NAME=${CONDUCTOR_CLIENT_SECRET_NAME:-conductor.client_secret}
      - SECRETS_MANAGER_URL=${SECRETS_MANAGER_URL:-}
      - DEFAULT_PROJECT_ID=${DEFAULT_PROJECT_ID:-}
      - SKIP_SERVICE_REGISTRATION=${SKIP_SERVICE_REGISTRATION:-false}
    ports:
      - "3116:3116"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ainet

  ai_manager:
    build:
      context: .
      dockerfile: ai_manager/Dockerfile
    container_name: aerekos-ai_manager
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3126
      - SERVICE_NAME=ai_manager
      # Workers register over LAN; browsers use https://cloudapi.aerekos.com
      - CONDUCTOR_URL=${CONDUCTOR_URL}
      - CONDUCTOR_TOKEN=${CONDUCTOR_TOKEN:-}
      - WORKER_TOKEN=${WORKER_TOKEN:-}
      # Ollama — external native GPU daemon on the host
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
      - OLLAMA_MODELS_DIR=${OLLAMA_MODELS_DIR:-/host-ollama}
      - VLLM_HOST=${VLLM_HOST:-http://host.docker.internal:8000}
      - VLLM_DEFAULT_MODEL=${VLLM_DEFAULT_MODEL:-shawnw3i/Huihui-Qwen3.8-27B-abliterated-AWQ-MTP}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.90}
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      - VLLM_REQUEST_TIMEOUT_MS=${VLLM_REQUEST_TIMEOUT_MS:-1800000}
      - LLM_BACKEND=${LLM_BACKEND:-ollama}
      # Voice — icarus contract upstreams on the Orin host
      - TTS_BACKEND=${TTS_BACKEND:-cache}
      - TTS_CACHE_URL=${TTS_CACHE_URL:-http://host.docker.internal:8015}
      - TTS_KOKORO_URL=${TTS_KOKORO_URL:-http://host.docker.internal:8013}
      - TTS_XTTS_URL=${TTS_XTTS_URL:-http://host.docker.internal:8002}
      - TTS_VOICE=${TTS_VOICE:-af_heart}
      - TTS_LANGUAGE=${TTS_LANGUAGE:-en}
      - STT_URL=${STT_URL:-http://host.docker.internal:8001}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-mxbai-embed-large}
      - AUTH_MANAGER_URL=${AUTH_MANAGER_URL}
      - RABBITMQ_URL=${RABBITMQ_URL:-}
      # GA default: require Bearer on :3126; homelab override AI_AUTH_REQUIRED=false in .env
      - AUTH_REQUIRED=${AI_AUTH_REQUIRED:-true}
      - MEMORY_DB_FALLBACK=${MEMORY_DB_FALLBACK:-1}
      - SKIP_SERVICE_REGISTRATION=${SKIP_SERVICE_REGISTRATION:-false}
      # Auto-benchmark new Ollama models (speed + JSON command compliance)
      - LLM_BENCH_ENABLED=${LLM_BENCH_ENABLED:-true}
      - LLM_BENCH_POLL_MS=${LLM_BENCH_POLL_MS:-900000}
      - LLM_BENCH_STARTUP_DELAY_MS=${LLM_BENCH_STARTUP_DELAY_MS:-45000}
      - LLM_BENCH_KEEP_ALIVE=${LLM_BENCH_KEEP_ALIVE:-0}
      - LLM_BENCH_GAP_MS=${LLM_BENCH_GAP_MS:-500}
      - BENCH_MAX_B=${BENCH_MAX_B:-12}
    ports:
      - "3126:3126"
    volumes:
      - ai_manager-data:/app/ai_manager/data
      # Shared with native Ollama — models pulled in either place are visible to both.
      - ${OLLAMA_MODELS_HOST:-/home/aerekos/.ollama}:/host-ollama
      - /var/run/docker.sock:/var/run/docker.sock
      # Read-only: existing dictionary word cache (tts-cache-gen data). Do not mount
      # writable — we never touch the running generator's DB from ai_manager.
      - ${TTS_CACHE_DATA:-/home/aerekos/work/tools/tts-cache/data}:/tts-cache-data:ro
    depends_on:
      - auth_manager
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ainet

  # GPU PEFT LoRA trainer. Shares ai_manager-data. Do not attach this to the
  # running vLLM container — separate process, tiny base model, idle until queued.
  lora_trainer:
    image: ${VLLM_IMAGE:-ghcr.io/nvidia-ai-iot/vllm:latest-jetson-orin}
    container_name: aerekos-lora_trainer
    restart: unless-stopped
    runtime: nvidia
    working_dir: /jobs
    entrypoint: ["python3"]
    command: ["/jobs/lora_worker.py"]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_HOME=/root/.cache/huggingface
      - LORA_JOBS_DIR=/data/lora-jobs
      - LORA_PIP_DIR=/data/lora-pip
      - LORA_BASE_MODEL=${LORA_BASE_MODEL:-sshleifer/tiny-gpt2}
      - LORA_MAX_STEPS=${LORA_MAX_STEPS:-8}
      - LORA_POLL_S=${LORA_POLL_S:-2}
    volumes:
      - ai_manager-data:/data
      - ./ai_manager/jobs:/jobs:ro
      - ${HF_HOME:-/home/aerekos/.cache/huggingface}:/root/.cache/huggingface
    networks:
      - ainet

  # Whisper STT — GPU. External volume keeps the already-downloaded model.
  stt:
    image: ${STT_IMAGE:-openclaw/stt-service:latest}
    container_name: aerekos-stt
    restart: unless-stopped
    runtime: nvidia
    environment:
      - MODEL_NAME=${STT_MODEL_NAME:-large-v3-turbo}
      - DEVICE=auto
      - HF_HOME=/models/hf
      - CACHE_DIR=/models/whisper
      - LOG_LEVEL=INFO
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    ports:
      - "8001:8000"
    volumes:
      - stt-models:/models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ainet

  # Kokoro-82M TTS — GPU. Voices bind is the existing tools/ catalog (read-only).
  tts_kokoro:
    image: ${TTS_KOKORO_IMAGE:-openclaw/tts-kokoro:latest}
    container_name: aerekos-tts-kokoro
    restart: unless-stopped
    runtime: nvidia
    environment:
      - DEVICE=auto
      - VOICES_DIR=/voices
      - DEFAULT_VOICE=${TTS_DEFAULT_VOICE:-default}
      - DEFAULT_LANGUAGE=en
      - KOKORO_VOICE=${TTS_VOICE:-af_heart}
      - KOKORO_LANG_CODE=a
      - HF_HOME=/models/hf
      - LOG_LEVEL=INFO
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    ports:
      - "8013:8000"
    volumes:
      - tts-kokoro-models:/models
      - ${TTS_VOICES_HOST:-/home/aerekos/work/tools/tts-service/voices}:/voices:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ainet

  # Dictionary cache API — CPU. Same 27G words.db; Kokoro over compose DNS.
  tts_cache:
    image: ${TTS_CACHE_IMAGE:-openclaw/tts-cache:latest}
    container_name: aerekos-tts-cache
    restart: unless-stopped
    environment:
      - KOKORO_URL=http://tts_kokoro:8000
      - TTS_VOICE=${TTS_VOICE:-af_heart}
      - TTS_LANGUAGE=en
      - DB_PATH=/data/words.db
      - WORD_LIST=/data/words.txt
      - GAP_MS=60
      - SENTENCE_GAP_MS=220
      - PORT=8000
      - LOG_LEVEL=INFO
    ports:
      - "8015:8000"
    volumes:
      - ${TTS_CACHE_DATA:-/home/aerekos/work/tools/tts-cache/data}:/data
    depends_on:
      - tts_kokoro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ainet

  # Dictionary generator — idle after the word list is complete. Same data bind.
  tts_cache_gen:
    image: ${TTS_CACHE_IMAGE:-openclaw/tts-cache:latest}
    container_name: aerekos-tts-cache-gen
    restart: unless-stopped
    command: ["node", "src/generate.js"]
    environment:
      - KOKORO_URL=http://tts_kokoro:8000
      - TTS_VOICE=${TTS_VOICE:-af_heart}
      - DB_PATH=/data/words.db
      - WORD_LIST=/data/words.txt
      - GEN_CONCURRENCY=4
    volumes:
      - ${TTS_CACHE_DATA:-/home/aerekos/work/tools/tts-cache/data}:/data
    depends_on:
      - tts_kokoro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ainet

networks:
  ainet:
    driver: bridge

volumes:
  ai_manager-data:
  stt-models:
    external: true
    name: tools_stt-models
  tts-kokoro-models:
    external: true
    name: tts-kokoro_tts-kokoro-models
