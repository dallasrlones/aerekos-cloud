# Standalone vLLM server on Jetson Orin (alongside docker-compose.ai.yml).
# Paged attention + continuous batching are vLLM defaults; --max-num-seqs tunes batch depth.
#
#   docker compose -f worker/docker-compose.vllm.yml up -d
#   curl -s http://127.0.0.1:8000/health
#
# Phase 0 mapping (oculus, JetPack R36):
#   Ollama qwen3.6:latest → qwen35moe 36B Q4_K_M
#   vLLM HF weights      → cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit
services:
  vllm:
    image: ${VLLM_IMAGE:-ghcr.io/nvidia-ai-iot/vllm:latest-jetson-orin}
    container_name: aerekos-vllm
    restart: unless-stopped
    runtime: nvidia
    network_mode: host
    shm_size: 16g
    volumes:
      - ${VLLM_MODELS_CACHE:-/home/aerekos/.cache/huggingface}:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - NVIDIA_VISIBLE_DEVICES=all
    command: >
      vllm serve ${VLLM_MODEL_ID:-cyankiwi/Qwen3.6-35B-A3B-AWQ-4bit}
      --host 0.0.0.0
      --port 8000
      --quantization awq
      --dtype half
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.5}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --max-num-seqs ${VLLM_MAX_NUM_SEQS:-8}
      --enable-prefix-caching
      --language-model-only
      --enforce-eager
      --reasoning-parser qwen3
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
