# Local dev — see worker/docker-compose.yml for full stack
services:
  email_manager:
    build:
      context: ..
      dockerfile: email_manager/Dockerfile.dev
    container_name: aerekos-email_manager
    ports:
      - "${PORT:-3113}:${PORT:-3113}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
