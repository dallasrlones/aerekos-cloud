# Local dev — see worker/docker-compose.yml for full stack
services:
  host_manager:
    build:
      context: ..
      dockerfile: host_manager/Dockerfile.dev
    container_name: aerekos-host_manager
    ports:
      - "${PORT:-3122}:${PORT:-3122}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
