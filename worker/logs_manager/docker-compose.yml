# Local dev — see worker/docker-compose.yml for full stack
services:
  logs_manager:
    build:
      context: ..
      dockerfile: logs_manager/Dockerfile.dev
    container_name: aerekos-logs_manager
    ports:
      - "${PORT:-3104}:${PORT:-3104}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
