# Local dev — see worker/docker-compose.yml for full stack
services:
  mcp_manager:
    build:
      context: ..
      dockerfile: mcp_manager/Dockerfile.dev
    container_name: aerekos-mcp_manager
    ports:
      - "${PORT:-3123}:${PORT:-3123}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
