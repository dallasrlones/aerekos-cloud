openapi: 3.0.3
info:
  title: notebook_manager (SageMaker notebook analog)
  version: 1.0.0
  description: |
    Project-scoped notebook records (name/image/url/status) plus
    POST /api/v1/notebooks/{id}/run which launches a compute_manager oneshot
    via the conductor proxy when CONDUCTOR_URL is set. Without conductor,
    run records status=queued honestly (no fake success).
    Conductor proxy prefix: /api/services/notebook_manager
    No production skip-fake flags; createManagerApp → assertNoSkipFakes() on boot.
servers:
  - url: http://localhost:3142
    description: Direct local
  - url: http://localhost:3000/api/services/notebook_manager
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness (SQLite)
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, aws, message }'
  /api/v1/ensure-defaults:
    post:
      summary: Seed default notebook (lab) when project has none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
      responses:
        '200':
          description: '{ ok, defaults }'
        '400':
          description: missing project_id
  /api/v1/notebooks:
    post:
      summary: Create a notebook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                image:
                  type: string
                url:
                  type: string
                status:
                  type: string
      responses:
        '201':
          description: '{ item }'
        '400':
          description: missing project_id/name
        '409':
          description: name taken
    get:
      summary: List notebooks
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/notebooks/{id}:
    get:
      summary: Get one notebook
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
        '404':
          description: not found
    patch:
      summary: Update a notebook
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                image:
                  type: string
                url:
                  type: string
                status:
                  type: string
      responses:
        '200':
          description: '{ item }'
    put:
      summary: Update a notebook (same as PATCH)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete a notebook
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ deleted, id }'
  /api/v1/notebooks/{id}/run:
    post:
      summary: Run notebook via compute oneshot (queues if CONDUCTOR_URL unset)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                image:
                  type: string
                command:
                  type: string
                env:
                  type: object
      responses:
        '200':
          description: '{ item, status, note?, task? }'
        '404':
          description: notebook not found
