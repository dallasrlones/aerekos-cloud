# Local dev — see worker/docker-compose.yml for full stack
services:
  queue_manager:
    build:
      context: ..
      dockerfile: queue_manager/Dockerfile.dev
    container_name: aerekos-queue_manager
    ports:
      - "${PORT:-3101}:${PORT:-3101}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
