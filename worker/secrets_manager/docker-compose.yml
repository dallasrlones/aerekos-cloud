# Local dev — see worker/docker-compose.yml for full stack
services:
  secrets_manager:
    build:
      context: ..
      dockerfile: secrets_manager/Dockerfile.dev
    container_name: aerekos-secrets_manager
    ports:
      - "${PORT:-3107}:${PORT:-3107}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
