# Local dev — see worker/docker-compose.yml for full stack
services:
  slack_manager:
    build:
      context: ..
      dockerfile: slack_manager/Dockerfile.dev
    container_name: aerekos-slack_manager
    ports:
      - "${PORT:-3115}:${PORT:-3115}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
