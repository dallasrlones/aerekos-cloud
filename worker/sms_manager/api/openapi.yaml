openapi: 3.0.3
info:
  title: sms_manager (SNS SMS analog)
  version: 1.0.0
  description: |
    Project-scoped SMS message rows (to_number/body) with optional
    POST .../send. Live Twilio only when secrets exist; otherwise queue-only.
    SKIP_SMS / SKIP_OUTBOUND force queue in tests/dev — refused when
    NODE_ENV=production via assertNoSkipFakes.
    Conductor proxy prefix: /api/services/sms_manager
servers:
  - url: http://localhost:3114
    description: Direct local
  - url: http://localhost:3000/api/services/sms_manager
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, message }'
  /api/v1/messages:
    post:
      summary: Create a queued message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                to_number:
                  type: string
                body:
                  type: string
                status:
                  type: string
      responses:
        '201':
          description: '{ item }'
        '400':
          description: missing project_id/name
        '409':
          description: name taken
    get:
      summary: List messages
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/messages/{id}:
    get:
      summary: Get one message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
        '404':
          description: not found
    patch:
      summary: Update a message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                to_number:
                  type: string
                body:
                  type: string
                status:
                  type: string
      responses:
        '200':
          description: '{ item }'
    put:
      summary: Update a message (same as PATCH)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete a message
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ deleted, id }'
  /api/v1/messages/{id}/send:
    post:
      summary: Attempt SMS send (queue-only without secrets / under SKIP_SMS)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item, skipped, reason, note? }'
        '404':
          description: not found
