# Local dev — see worker/docker-compose.yml for full stack
services:
  sms_manager:
    build:
      context: ..
      dockerfile: sms_manager/Dockerfile.dev
    container_name: aerekos-sms_manager
    ports:
      - "${PORT:-3114}:${PORT:-3114}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
