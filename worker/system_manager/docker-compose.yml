# Local dev — see worker/docker-compose.yml for full stack
services:
  system_manager:
    build:
      context: ..
      dockerfile: system_manager/Dockerfile.dev
    container_name: aerekos-system_manager
    ports:
      - "${PORT:-3127}:${PORT:-3127}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
