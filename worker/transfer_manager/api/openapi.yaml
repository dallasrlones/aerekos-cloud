openapi: 3.0.3
info:
  title: transfer_manager (Transfer Family analog)
  version: 1.0.0
  description: |
    Project-scoped SFTP-style endpoint metadata (CRUD /api/v1/endpoints) plus
    put/get object copy through storage_manager via the conductor proxy.
    Not a live SFTP daemon — Transfer Family naming analog only.
    Conductor proxy prefix: /api/services/transfer_manager
    No production skip-fake flags; assertNoSkipFakes() + createManagerApp on boot.
servers:
  - url: http://localhost:3148
    description: Direct local
  - url: http://localhost:3000/api/services/transfer_manager
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness (SQLite)
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, aws, message }'
  /api/v1/ensure-defaults:
    post:
      summary: Seed default sftp endpoint when project has none
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
      responses:
        '200':
          description: '{ ok, defaults }'
        '400':
          description: missing project_id
  /api/v1/endpoints:
    post:
      summary: Create an endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                bucket:
                  type: string
                protocol:
                  type: string
      responses:
        '201':
          description: '{ item }'
        '400':
          description: missing project_id/name
        '409':
          description: name taken
    get:
      summary: List endpoints
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/endpoints/{id}:
    get:
      summary: Get one endpoint
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
        '404':
          description: not found
    patch:
      summary: Update an endpoint
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                bucket:
                  type: string
                protocol:
                  type: string
      responses:
        '200':
          description: '{ item }'
    put:
      summary: Update an endpoint (same as PATCH)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete an endpoint
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ deleted, id }'
  /api/v1/endpoints/{id}/put:
    post:
      summary: Write an object via storage_manager (needs CONDUCTOR_URL)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bucket:
                  type: string
                key:
                  type: string
                path:
                  type: string
                content:
                  type: string
                body:
                  type: string
                encoding:
                  type: string
      responses:
        '200':
          description: '{ ok, bucket, key, result }'
        '400':
          description: missing bucket/key
        '503':
          description: CONDUCTOR_URL / storage_manager unavailable
  /api/v1/endpoints/{id}/get:
    post:
      summary: Read an object via storage_manager (needs CONDUCTOR_URL)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                bucket:
                  type: string
                key:
                  type: string
                path:
                  type: string
                encoding:
                  type: string
      responses:
        '200':
          description: '{ ok, bucket, key, content }'
        '400':
          description: missing bucket/key
        '503':
          description: CONDUCTOR_URL / storage_manager unavailable
