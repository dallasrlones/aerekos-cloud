# Local dev — see worker/docker-compose.yml for full stack
services:
  tunnel_manager:
    build:
      context: ..
      dockerfile: tunnel_manager/Dockerfile.dev
    container_name: aerekos-tunnel_manager
    ports:
      - "${PORT:-3110}:${PORT:-3110}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
