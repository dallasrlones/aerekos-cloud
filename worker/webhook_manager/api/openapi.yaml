openapi: 3.0.3
info:
  title: webhook_manager (EventBridge / SNS HTTP analog)
  version: 1.0.0
  description: |
    Project-scoped outbound webhooks: CRUD /api/v1/webhooks, POST …/dispatch,
    and GET …/deliveries. SKIP_OUTBOUND=1 records skipped deliveries without HTTP
    (tests/dev only — refused when NODE_ENV=production via assertNoSkipFakes +
    createManagerApp). Not an inbound receiver. Live conductor proxy e2e parked.
    Conductor proxy prefix: /api/services/webhook_manager
servers:
  - url: http://localhost:3112
    description: Direct local
  - url: http://localhost:3000/api/services/webhook_manager
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness (SQLite)
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, message }'
  /api/v1/webhooks:
    post:
      summary: Create an endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name, target_url]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                target_url:
                  type: string
                  description: http or https URL
                secret:
                  type: string
                  description: Sent as X-Aerekos-Webhook-Secret on live dispatch
                headers:
                  type: string
                  description: JSON object string of extra headers
                enabled:
                  type: boolean
      responses:
        '201':
          description: '{ webhook }'
        '400':
          description: validation error
        '409':
          description: name taken
    get:
      summary: List endpoints
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ webhooks }'
  /api/v1/webhooks/{id}:
    get:
      summary: Get one endpoint
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ webhook }'
        '404':
          description: not found
    patch:
      summary: Update an endpoint
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                target_url:
                  type: string
                secret:
                  type: string
                headers:
                  type: string
                enabled:
                  type: boolean
      responses:
        '200':
          description: '{ webhook }'
    put:
      summary: Update an endpoint (same as PATCH)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ webhook }'
    delete:
      summary: Delete an endpoint (and its deliveries)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ deleted, id }'
  /api/v1/webhooks/{id}/dispatch:
    post:
      summary: Dispatch payload (live HTTP or skipped under SKIP_OUTBOUND)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: string
      responses:
        '201':
          description: '{ delivery, mode } mode is skip|live'
        '400':
          description: disabled or validation
        '404':
          description: not found
  /api/v1/webhooks/{id}/deliveries:
    get:
      summary: List delivery history
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ deliveries }'
