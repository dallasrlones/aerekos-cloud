openapi: 3.0.3
info:
  title: worker_manager (SSM fleet / tags analog)
  version: 1.0.0
  description: |
    Project-scoped worker/fleet annotation records (name/worker_id/key/value)
    plus optional POST /api/v1/sync from conductor /api/workers.
    Not live AWS SSM — SQLite labels/metadata only; the worker agent package
    owns node lifecycle. Skip-fakes are refused when NODE_ENV=production via
    assertNoSkipFakes on boot.
    Conductor proxy prefix: /api/services/worker_manager
servers:
  - url: http://localhost:3128
    description: Direct local
  - url: http://localhost:3000/api/services/worker_manager
    description: Via conductor proxy
paths:
  /health:
    get:
      summary: Liveness (SQLite)
      responses:
        '200':
          description: healthy
        '503':
          description: unhealthy
  /ready:
    get:
      summary: Readiness
      responses:
        '200':
          description: ready
        '503':
          description: not ready
  /metrics:
    get:
      summary: Prometheus metrics
      responses:
        '200':
          description: text exposition
  /api/v1/info:
    get:
      summary: Service metadata
      responses:
        '200':
          description: '{ service, title, version, status, message }'
  /api/v1/sync:
    post:
      summary: Upsert annotations from conductor /api/workers for a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
      responses:
        '200':
          description: '{ upserted, items }'
        '400':
          description: project_id required
        '503':
          description: CONDUCTOR_URL required / conductor unreachable
  /api/v1/annotations:
    post:
      summary: Create an annotation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                worker_id:
                  type: string
                key:
                  type: string
                value:
                  type: string
      responses:
        '201':
          description: '{ item }'
        '400':
          description: missing project_id/name
        '409':
          description: name taken
    get:
      summary: List annotations
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ items }'
  /api/v1/annotations/{id}:
    get:
      summary: Get one annotation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
        '404':
          description: not found
    patch:
      summary: Update an annotation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                worker_id:
                  type: string
                key:
                  type: string
                value:
                  type: string
      responses:
        '200':
          description: '{ item }'
    put:
      summary: Update an annotation (same as PATCH)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ item }'
    delete:
      summary: Delete an annotation
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: project_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: '{ deleted, id }'
