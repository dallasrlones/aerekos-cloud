# Local dev — see worker/docker-compose.yml for full stack
services:
  worker_manager:
    build:
      context: ..
      dockerfile: worker_manager/Dockerfile.dev
    container_name: aerekos-worker_manager
    ports:
      - "${PORT:-3128}:${PORT:-3128}"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
    restart: unless-stopped
